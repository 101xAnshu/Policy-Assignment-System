services:
  postgres:
    image: postgres:16-alpine
    container_name: warp-postgres
    environment:
      POSTGRES_DB: warp_dev
      POSTGRES_USER: warp
      POSTGRES_PASSWORD: warp_local
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warp -d warp_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
